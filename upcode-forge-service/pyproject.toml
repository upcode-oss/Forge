[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "upcode-forge-service"
version = "0.1.0"
description = "Self-hosted Git collaboration with FastAPI and SQLAlchemy"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0.36,<3",
  "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3",
  "argon2-cffi>=25,<26", "cryptography>=44,<47", "psycopg[binary]>=3.2,<4",
  "PyMySQL>=1.1,<2", "Pillow>=12.3,<13",
  "asyncssh>=2.24.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
